<!-- Web Push & Alpine.js Scripts -->
<script>
const PUBLIC_VAPID_KEY = 'BJNPsBLXpVqCEOJz-2OM_1ICVYVpIFlyFfIRwd8pKeYjQavcZF2Nx5DCOwwXFl3Ml6SGfyG3kz24pQjaoVpDewY';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

let currentPushSub = null;

async function subscribePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Web Push не поддерживается или сайт открыт не с экрана "Домой"!');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('Запрос разрешений отклонен');
      return;
    }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
    });
    currentPushSub = sub;
    await fetch('/api/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: sub, action: 'save' })
    });
    alert('🔔 Push-уведомления успешно подсоединены!');
  } catch (e) {
    alert('Ошибка при включении пушей: ' + e.message);
  }
}

async function testPush() {
  if (!currentPushSub) {
    await subscribePush();
    if (!currentPushSub) return;
  }
  try {
    const res = await fetch('/api/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        subscription: currentPushSub,
        action: 'send',
        payload: { title: 'Мой День 🚀', body: 'Тестовый push успешно пришел на iPhone!' }
      })
    });
    const data = await res.json();
    if (data.success) {
      alert('Уведомление отправлено! Выйдите на рабочий стол iPhone.');
    } else {
      alert('Ошибка: ' + data.error);
    }
  } catch (e) {
    alert('Ошибка сети: ' + e.message);
  }
}

const HOME_ICONS = {
  pill: '<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  dumbbell: '<path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3 9v6"/><path d="M21 9v6"/><path d="M6.5 12h11"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>'
};

const ICONS = {
  pill: '<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/>',
  sunrise: '<path d="M12 2v8"/><path d="M22 22H2"/><path d="M16 18a4 4 0 0 0-8 0"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  package: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>'
};

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function shell() {
  return {
    view: 'home',
    tick: 0,
    sections: [
      { id: 'meds', title: 'Лекарства', desc: 'Приём препаратов, аптечка и история', color: '#10b981', icon: 'pill', active: true },
      { id: 'sport', title: 'Спорт', desc: 'Тренировки, нагрузка и прогресс', color: '#6366f1', icon: 'dumbbell', active: true }
    ],
    hic(name, cls) { return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${HOME_ICONS[name] || ''}</svg>`; },
    get greeting() { return 'Добрый день'; },
    get dateText() { return new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }); },
    get cards() { return this.sections; },
    openView(id) { this.view = id; window.scrollTo(0,0); }
  };
}

function medApp() {
  return {
    tab: 'today',
    today: ymd(new Date()),
    meds: [
      { id: 'm1', name: 'Метформин', dose: '500 мг', times: ['08:00', '20:00'], color: '#10b981', icon: 'pill' }
    ],
    logs: {},
    nav: [
      { id: 'today', label: 'Сегодня', icon: 'home' },
      { id: 'cabinet', label: 'Аптечка', icon: 'package' },
      { id: 'history', label: 'История', icon: 'clock' }
    ],
    periods: [{ id: 'morning', title: 'Утро', range: '05:00 – 11:59', icon: 'sunrise' }],
    get greeting() { return 'Добрый день'; },
    get stats() { return { total: 2, taken: 1, skipped: 0, pending: 1, pctTaken: 50, pctSkipped: 0 }; },
    get lowStockCount() { return 0; },
    itemsFor(pid) {
      return [{ key: 'm1|08:00', med: this.meds[0], time: '08:00', entry: null }];
    },
    longDate(key) { return new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }); },
    ic(name, cls) { return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${ICONS[name] || ICONS.pill}</svg>`; },
    go(id) { this.tab = id; },
    mark(it, st) { it.entry = { status: st }; },
    openAdd() {},
    init() {}
  };
}

function sportApp() {
  return {
    tab: 'today',
    nav: [{ id: 'today', label: 'Сегодня', icon: 'home' }],
    ic(name, cls) { return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${ICONS[name] || ICONS.pill}</svg>`; },
    init() {}
  };
}
</script>
